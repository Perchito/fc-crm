<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · FC Cleaning CRM</title>
<link rel="icon" href="/fc-logo.webp">
<meta name="theme-color" content="#003C71">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/img/app-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FC CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --navy: #003C71; --ink: #0f1b2d; --muted: #5b6b80; --line: #d8e1ec; --bg: #f2f6fb; --danger: #b42318; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; box-shadow: 0 12px 40px rgba(0,40,80,.08); }
  img { display: block; width: 88px; margin: 0 auto 12px; }
  h1 { font-size: 22px; margin: 0 0 4px; text-align: center; color: var(--navy); }
  p.sub { margin: 0 0 24px; text-align: center; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; }
  input:focus { outline: 3px solid rgba(0,60,113,.2); border-color: var(--navy); }
  button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 10px; background: var(--navy); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <img src="/fc-logo.png" alt="FC Cleaning Company Ltd">
  <h1>FC Cleaning CRM</h1>
  <p class="sub">Sign in to continue</p>
  <form id="f" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
    <button id="go">Sign in</button>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  err.textContent = ''; btn.disabled = true;
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-FC-CSRF': '1' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
    if (r.ok) { location.href = '/'; return; }
    err.textContent = (await r.json().catch(() => ({}))).error || 'Sign in failed.';
  } catch { err.textContent = 'Can’t reach the server — check your connection.'; }
  btn.disabled = false;
});
</script>
</body>
</html>
